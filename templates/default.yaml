# Sawmill project config.
#
# mill build seeds this file to ~/.config/sawmill/default.yaml and copies it
# into each millyard as .mill/config.yaml. Edit the ~/.config copy to change
# your house defaults; edit .mill/config.yaml to change one millyard.
# .mill/ is never committed, so this file never reaches the repo.
#
# Every valid key is listed. Keys that are commented out are optional or have
# no sensible default. Everything else is required and shown with its default.

# REQUIRED, no default, never guessed. The project name. Used for the DDEV
# project (<ticket>-<name>) and for the worktrees root layout
# (<worktrees>/<name>/<ticket>). Every mill command halts while it is missing.
# name: islandhealth

# Where the tickets live. backend is github or gitlab. repo is owner/name on
# GitHub, or group/subgroup/name on GitLab. host is only needed for
# self-hosted GitLab.
tracker:
  backend: github
  # repo: owner/name
  # host: git.example.com

# The branch worktrees are cut from and merged into. The millyard must be on
# this branch, clean, before mill run draft or mill run will start.
integration: main

# The agent runtime that runs each role as a child process in the worktree.
# One of: claude-code, pi, codex.
runtime: claude-code

# Optional, only with runtime: pi. Absent: inherit pi.extensions from
# ~/.config/sawmill/config.yaml. A project list replaces the global list;
# extensions: [] disables all optional extensions here. Keep absent in this
# template to inherit live global defaults instead of copying a per-project list.
# Entries are existing local files/directories; ~ expands to the user's home,
# relative paths resolve from the millyard root. Automatic discovery stays off.
# TRUST: extension code runs with your full user permissions. See docs/pi-runtime.md.
# pi:
#   extensions:
#     - ~/.pi/agent/extensions/pi-claude-subscription

# Model and effort per role. effort is one of: low, medium, high, max.
# Model ids are the runtime's own. Pick a cheap model to write tests, a strong
# one to implement, and the strongest you can afford to review.
roles:
  test-writers:
    model: claude-sonnet-5-5
    effort: medium
  implementer:
    model: claude-opus-5-5
    effort: high
  reviewer:
    model: claude-opus-5-5
    effort: high

# Jev (TypeSafe) features: independent opt-ins, all off by default. Each sends
# bounded, redacted excerpts to TypeSafe only when invoked. Requires the optional
# @typesafe-ai/sdk and TYPESAFE_API_KEY in Mill's environment; never put the key here.
# Advisory screens never replace reasoning review or authorize a merge. Routing
# selects coding-role models within the machine policy; it never reroutes reviewers.
# Screen timeout: positive duration up to 60s (1m); max_evidence_chars: 1-16000.
# Defaults below. See docs/{draft,acceptance,ci}-screening.md, the sawdust skill's
# screening.md, and docs/model-routing.md for evidence and privacy boundaries.
# jev:
#   # Reviews ticket clarity/scope/blocked-by; sends title, body and selected comments.
#   draft: { enabled: false, timeout: 10s, max_evidence_chars: 4000 }
#   # Checks acceptance claims; sends requirement, test source and observed result excerpts.
#   acceptance: { enabled: false, timeout: 10s, max_evidence_chars: 4000 }
#   # Helps investigate failed CI; sends selected saved-log diagnostic excerpts.
#   ci: { enabled: false, timeout: 10s, max_evidence_chars: 4000 }
#   # Sorts learning observations; sends only scoped observation evidence excerpts.
#   learn: { enabled: false, timeout: 10s, max_evidence_chars: 4000 }
#   # Recommends coding tiers; sends requirements/comments and relevant tracked code.
#   # Needs model_routing policy in ~/.config/sawmill/config.yaml.
#   routing: { enabled: false }

# How long one role may run before it is treated as an infrastructure failure
# and retried. Suffixes: s, m, h.
role_timeout: 60m

# The project's test command, run in the worktree by the implementer and by
# mill integrate before merge. timeout is an infrastructure failure, never a
# test failure and never a reviewer finding.
#
# preflight is optional: a shell command run in each new worktree after
# setup.sh, before any role. Non-zero puts the ticket in logjam. Without it,
# Mill checks that the test command's first word resolves and, when
# package.json exists, that node_modules does.
#
# A project with no tests can opt out on purpose by replacing the whole block
# below with this one line:
#
#   tests: none
#
# That turns off the test-writers, the red check after them, every test run
# Mill hands to a role, and the local test run before merge. A missing tests
# key is still an error, so nobody ends up with no tests by accident.
#
# focused is optional: a runner roles may call with test paths under scope,
# and optionally name_flag with one test name. It supplements the test
# command and never replaces it in Mill's red, green or merge runs.
tests:
  command: npm test
  timeout: 30m
  # preflight: test -x node_modules/.bin/tsc
  # focused:
  #   command: node --test
  #   scope: dist/test
  #   name_flag: --test-name-pattern

# Optional named checks roles may run exactly as written: build, lint and
# typecheck. Each is one command with literal arguments, no shell syntax.
# Only declared checks are advertised to roles and allowed.
# checks:
#   build: npm run build
#   lint: npm run lint
#   typecheck: npx tsc --noEmit

# Optional checks Mill itself runs on the rebased final head before push, in
# this order: clean, build, lint, typecheck, artifact. Each is a shell command
# run in the worktree. Any failure, missing command or timeout blocks delivery
# with its output, and they run even with tests: none. Mill deletes nothing
# itself: use clean to remove generated output so a stale build cannot pass.
# artifact smokes the actual installable or build artifact, not the source
# tree: for a package, pack it and install it in a clean temporary folder.
# Unlike checks above, these are not granted to roles.
# required_checks:
#   clean: rm -rf dist
#   build: npm run build
#   artifact: d=$(mktemp -d) && npm pack --pack-destination "$d" && npm install --prefix "$d" "$d"/*.tgz
#   timeout: 30m

# Optional release obligations mill release handoff reports after a merge. Mill
# never performs or deploys them. kind: migration, configuration, assets,
# external-effect or manual. paths: the step applies only when the delivered
# change touches a matching file. check: a required check whose pass verifies
# the step; without one the step stays pending. recovery: reversible (undone
# with the code), separate (only a backup or restore recovers it) or
# irreversible. rollback is shown only when declared here.
# release:
#   steps:
#     - id: update-db
#       kind: migration
#       text: Run drush updatedb; existing content keeps its values.
#       paths: ['**/*.install']
#       recovery: irreversible
#       recovery_note: Restore the database backup taken before the update.

# wait: after the rebase gate, push the branch and wait for the tracker's
# pipeline on that exact commit before merging; red is one more implementer
# round. none: merge on green local tests.
ci: none

# Optional, GitHub with ci: wait only. Names the hosted checks (check runs or
# commit status contexts) that must each report on the exact head before Mill
# merges: an absent or pending one waits, any failed run of that name fails,
# and skipped or neutral counts as passed. A failure of an advisory check never
# blocks. Every other check still gates as before. GitLab keeps its own
# pipeline rules, so this key is refused there.
# mill run draft also reads the integration branch's required status checks
# (rulesets and branch protection) and adds them. With ci: wait, a draft that
# finds neither those nor ci_checks is refused, as is any merge queue (GitHub)
# or merged results pipeline or merge train (GitLab). The draft output, the PR
# body and the merge report show the policy and where it came from.
# ci_checks:
#   required: [phpunit]
#   advisory: [docs]

# How mill integrate merges the PR or MR through the tracker: squash or merge.
merge_method: squash

# REQUIRED, no default. How the reviewer reaches a running site to perform the
# ticket's "User test cases". ddev: the URL comes from `ddev describe` in the
# worktree. docker: set test_url below. none: opt out of user testing on
# purpose; a run containing a ticket with user test cases is then refused at
# draft time. mill build fills this in when it finds .ddev/ or Docker files,
# and every mill command aborts while it is missing.
# test_harness: none

# The site URL the reviewer drives when test_harness is docker.
# test_url: http://localhost:8080

# How long each delivery phase outside the roles may wait before Mill stops
# it, kills its own processes and leaves a recoverable stop naming the command
# that resumes. setup and teardown bound .mill/setup.sh and .mill/teardown.sh;
# prepare the fetch of the integration branch; site each run of
# .mill/prepare.sh; install the `npm ci` repair; readiness the workspace
# preflight; ci the wait for the pipeline when ci is wait. Suffixes: s, m, h.
# Shown with their defaults.
# phase_timeouts:
#   setup: 30m
#   prepare: 1m
#   site: 30m
#   install: 30m
#   readiness: 15m
#   ci: 3h
#   teardown: 10m

# Names of the labels Sawmill writes to the tracker. Only logjam exists.
# labels:
#   logjam: logjam

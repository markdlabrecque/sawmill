# Sawmill machine config: ~/.config/sawmill/config.yaml
#
# mill build seeds this file if it is missing. These settings apply to every
# millyard on this desktop. Per-project settings live in .mill/config.yaml,
# seeded from ~/.config/sawmill/default.yaml.
#
# Every valid key is listed. Keys that are commented out are optional.
# Everything else is shown with its default.

# Optional Pi extension allowlist, inherited by runtime: pi projects. No entry
# means no optional extensions; automatic discovery always stays disabled.
# Local files/directories only. ~ expands to the user's home; relative paths
# resolve beside this config file. Missing effective paths fail configuration.
# A project's .mill/config.yaml pi.extensions replaces this list; [] disables it.
# TRUST: extension code runs with your full user permissions. See docs/pi-runtime.md.
# pi:
#   extensions:
#     - ~/.pi/agent/extensions/pi-claude-subscription

# Optional Jev routing policy; projects opt in via jev.routing.enabled in
# .mill/config.yaml. Does not enable any screen. Needs @typesafe-ai/sdk and
# TYPESAFE_API_KEY in the execution/scheduler environment (never in this file).
# policy_version: your policy identity (letters, digits, dots, hyphens; 1-80 chars).
# model and question_version are pinned to the values shown. timeout defaults to
# 10s, in whole seconds up to 60s; max_evidence_chars defaults to 4000, range 1-16000.
# min_confidence is required, from 0 to 1: a policy cutoff, not calibrated proof.
# families may contain gpt and claude. Tier keys are <model>-<effort>, each low,
# medium or high (all nine combinations supported). Omitted tiers use the baseline.
# Each mapping requires model and effort (low, medium, high or max); runtime
# validation additionally restricts supported combinations and family. These Pi
# examples use provider-qualified IDs; use your runtime's literal IDs instead.
# See docs/model-routing.md for data sent, fallback rules and runtime constraints.
# model_routing:
#   policy_version: local-v1
#   model: jev-1.14.0
#   question_version: coding-tiers-v1
#   timeout: 10s
#   max_evidence_chars: 4000
#   min_confidence: 0.95
#   families:
#     gpt:
#       low-low: { model: openai/gpt-6.1, effort: low }
#       high-high: { model: openai/gpt-6.1, effort: high }
#     claude:
#       low-low: { model: anthropic/claude-sonnet-4-6, effort: low }
#       high-high: { model: anthropic/claude-opus-4-6, effort: high }

# How many tickets may be working at once, across all millyards. Start low
# until your model plan proves it can take more.
concurrency: 2

# How many times a role or mill integrate is retried after an infrastructure
# failure (runtime would not start, provider down, tool loop, test timeout)
# before the ticket goes to logjam. These retries never count as bounces.
infrastructure_retries: 3

# After this many dispatches in a row end in infrastructure failure, mill run
# stops dispatching new tickets until a team exits successfully.
pause_threshold: 3

# Where worktrees are created. Absent: beside the millyard, named by the
# ticket number (a millyard at code/main gets code/123). Set:
# <worktrees>/<name>/<ticket>, where <name> is from .mill/config.yaml.
# worktrees: /home/me/projects

# How often mill integrate asks the tracker whether the pipeline for the
# rebased commit has finished, when ci is wait. Nothing else in mill polls:
# teams are child processes and the loop is told when one exits.
ci_poll_interval: 30s

# How long mill update waits for working tickets to finish before it gives
# up, leaves the installed mill unchanged and releases dispatch. Default 4h.
# update_drain_timeout: 4h
